
name: Build SuperbMirror APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o SuperbMirror_GitHub_Paketi.zip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Force Java and Kotlin target 17
        run: |
          cat >> SuperbMirror/app/build.gradle.kts <<'EOF'

          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          EOF

      - name: Build APK
        working-directory: SuperbMirror
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperbMirror-debug-apk
          path: SuperbMirror/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

